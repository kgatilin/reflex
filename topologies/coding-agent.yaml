# coding-agent — the doc-29 §4b state-defined coding agent, as a topology document.
#
# This is the OPERATOR document. The fs + pytest HANDS are out-of-process plugins
# launched by `reflexd serve --root <repo>` (which confines them to <repo>); this
# document does not carry their spawn command or root — a host concern. Each hand
# is a NORMAL subscriber here, named after the tool-call kind it serves, scoped
# `in: request` (so it sits inside the budgeted agent loop). The daemon backs each
# by the plugin that HANDLES its kind — the link is the kind, not a reference. See
# topologies/README.md for the run recipe.
#
# Completion model (CONCEPT §3/§9): the brain NEVER asserts done with a function.
# A turn that calls NO function is the brain's CLAIM of completion — it surfaces as
# llm.message (prose) or llm.empty (silence). The claim is then EVALUATED
# independently, never trusted:
#
#   brain turn ─┬─ tool.*.call ──▶ hand ──▶ tool.*.result|.failed ──▶ brain (loop)
#               ├─ llm.message (prose CLAIM) ──▶ verifier (re-runs the tests)
#               │      tests red  ──▶ verify.failed ──▶ brain (another turn)
#               │      tests green ──▶ check.passed ──▶ judge (an independent llm)
#               │            judge.approved ──▶ done ──▶ state.updated.status{done}
#               │            judge.rejected ──▶ brain (the work games the tests)
#               └─ llm.empty (silence)  ──▶ brain (bounded re-prompt)
#
#   state.updated.status{done}          ──▶ request.terminal
#   scope.request.budget_exhausted      ──▶ request.terminal{failed}
#
# Done is a VERIFIED value (a deterministic check AND an llm reviewer), never the
# model's word. The judge is just another llm node — adding a second opinion is a
# config change, not a new abstraction. The loop is event closure, bounded by the
# request scope budget (the termination backstop).

scopes:
  - name: request
    root: request.received
    budget:
      # The loop's termination backstop (CONCEPT §4): every brain turn emits exactly
      # one of these (a tool call, the prose claim, or silence), so capping them caps
      # the loop. Tune per repo size (doc 29 §8).
      tool.fs.read.call: 80
      tool.fs.edit.call: 80
      tool.fs.write.call: 40
      tool.fs.search.call: 80
      tool.py.test.call: 20
      # llm.message caps verify+judge attempts (each prose claim re-runs the tests
      # and, if green, the reviewer); llm.empty caps degenerate silent turns.
      llm.message: 8
      llm.empty: 6

events:
  # Domain kinds only — the engine self-registers its own (scope.request.closed /
  # .budget_exhausted), and the fs/pytest plugins self-register the tool.* kinds.
  - kind: task.new            # external entry: the GitHub-issue text, fed by `emit`
  - kind: request.received    # roots the request scope
  - kind: check.passed        # the deterministic verifier's green (tests pass)
  - kind: verify.failed       # the verifier (or judge) kicked it back into the loop
  - kind: judge.approved      # the reviewer affirms the claim — the only path to done
  - kind: judge.rejected      # the reviewer rejects (silence/prose fold to this)
  - kind: state.updated.status
  - kind: request.terminal    # the drive-to-terminal fact (`emit --wait`)
    terminal: true            #   a graph output: consumed by the CLient, no in-graph consumer
  - kind: llm.message         # a no-function turn: the brain's prose CLAIM of done
  - kind: llm.empty           # a no-function EMPTY turn: a bounded re-prompt
  - kind: llm.usage           # token accounting
    terminal: true            #   observability leaf, no consumer required

subscribers:
  # resolver — the entry/resolver role: map the external task.new into the domain
  # root request.received, carrying the issue text through.
  - name: resolver
    on: [task.new]
    in: global
    emits: [request.received]
    body:
      kind: entry
      config: { emit: request.received }

  # brain — the reasoning core (llm). It hears the task and every tool/verify/judge
  # result, reads its assembled history, and either CALLS a function or STOPS. A
  # stop (prose ⇒ llm.message, silence ⇒ llm.empty) is its claim, evaluated
  # downstream — it never calls a "done" function. Its Emits allowlist IS the menu.
  - name: brain
    on:
      - request.received
      - tool.fs.read.result
      - tool.fs.read.failed
      - tool.fs.edit.result
      - tool.fs.edit.failed
      - tool.fs.write.result
      - tool.fs.write.failed
      - tool.fs.search.result
      - tool.fs.search.failed
      - tool.py.test.result
      - tool.py.test.failed
      # the loop re-drives on rejection of a claim (tests red, or the reviewer
      # rejected) and on its own degenerate silence (a bounded re-prompt).
      - verify.failed
      - judge.rejected
      - llm.empty
    in: request
    reads: [brain.history]
    emits:
      - tool.fs.read.call
      - tool.fs.edit.call
      - tool.fs.write.call
      - tool.fs.search.call
      - tool.py.test.call
      - llm.message      # prose claim of done (the answer kind)
      - llm.empty        # degenerate silent turn (the empty kind)
      - llm.usage
    body:
      kind: llm
      config:
        model: vertex:gemini-3.5-flash
        project: iow-uagent          # GCP project (Gemini on Vertex); override per deployment
        location: global
        max_tokens: 8192             # headroom: a thinking model spends tokens before the visible turn
        system: |
          You are a coding agent resolving a software issue in a checked-out repository.
          Work in a read → edit → test loop using the provided functions:
            - tool.fs.search / tool.fs.read to find and read the relevant code,
            - tool.fs.edit / tool.fs.write to change it,
            - tool.py.test to run the tests.
          After every edit, run tool.py.test. When — and ONLY when — the tests pass and
          the issue is resolved, STOP CALLING FUNCTIONS and reply with a short prose
          summary of the fix. That prose IS your claim of completion: an independent
          verifier re-runs the tests and a reviewer inspects the change; if either
          rejects it you receive feedback and continue. Never announce completion while
          still calling functions, and never stop before the tests pass.

  # fs / pytest hands — NORMAL subscribers, one per tool-call kind, scoped in the
  # request loop. No plugin reference: the daemon backs each by the plugin that
  # HANDLES its kind (fs / pytest, launched by `reflexd serve --root <repo>`), and
  # defaults its Emits to the plugin's produced result/failed kinds. The link is
  # the kind. On defaults to [name].
  - { name: tool.fs.read.call,   in: request }
  - { name: tool.fs.edit.call,   in: request }
  - { name: tool.fs.write.call,  in: request }
  - { name: tool.fs.search.call, in: request }
  - { name: tool.py.test.call,   in: request }

  # verifier — the DETERMINISTIC check of the brain's claim (CONCEPT §3/§9). On the
  # prose claim (llm.message) it re-runs the agreed test command: green ⇒ check.passed
  # (handed to the reviewer), red ⇒ verify.failed back into the loop. It no longer
  # writes done directly — green is necessary, not sufficient; the reviewer gates done.
  - name: verifier
    on: [llm.message]
    in: request
    emits: [check.passed, verify.failed]
    body:
      kind: verifier
      config:
        command: [python, -m, pytest, -q]
        status_kind: check.passed
        pass: ok
        fail_emit: verify.failed

  # judge — the independent REVIEWER, just another llm node (config, not an
  # abstraction). On check.passed it reads the task + the brain's claim + the test
  # evidence and decides: call judge.approved to affirm, or stay silent / explain to
  # reject (Answer == Empty == judge.rejected folds prose AND silence to rejection,
  # so only an affirmative function call approves). Catches tests-pass-but-gamed.
  - name: judge
    on: [check.passed]
    in: request
    reads: [judge.history]
    emits: [judge.approved, judge.rejected, llm.usage]
    body:
      kind: llm
      config:
        model: vertex:gemini-3.5-flash
        project: iow-uagent
        location: global
        max_tokens: 8192
        answer: judge.rejected       # prose (no approval call) ⇒ rejected
        empty: judge.rejected        # silence ⇒ rejected
        system: |
          You are an independent reviewer. A coding agent claims it resolved the issue,
          and an automated check has confirmed the tests pass. Decide whether the change
          GENUINELY resolves the described issue rather than gaming the tests (hardcoding
          expected values, deleting or weakening tests, masking the bug). If it genuinely
          resolves the issue, call judge.approved. Otherwise reply with a short reason —
          prose or silence both count as NOT approved and send the agent back to work.

  # done — the verified terminal status: on the reviewer's affirmation, write
  # state.updated.status{done}. This is the ONLY writer of done (a deterministic
  # green AND a reviewer approval upstream of it).
  - name: done
    on: [judge.approved]
    in: request
    emits: [state.updated.status]
    body:
      kind: entry
      config: { emit: state.updated.status, payload: { status: done } }

  # terminal-on-done — lifecycle watcher (global cone): turn the verified terminal
  # status into the single drive-to-terminal fact.
  - name: terminal-on-done
    on: [state.updated.status]
    in: global
    emits: [request.terminal]
    body:
      kind: gate
      config: { emit: request.terminal, when: [done] }

  # terminal-on-exhaust — the budget backstop: exhaustion maps straight to a failed
  # terminal so a stuck loop still terminates with a verdict (not in the void).
  - name: terminal-on-exhaust
    on: [scope.request.budget_exhausted]
    in: global
    emits: [request.terminal]
    body:
      kind: entry
      config: { emit: request.terminal, payload: { status: failed } }

projections:
  # brain.history — the llm.history view the brain reads: the task as the first user
  # message, the brain's own calls/prose as assistant turns, tool results and the
  # rejection feedback (verify.failed / judge.rejected) and the re-prompt (llm.empty)
  # as user turns. params.emits must mirror the brain's menu MINUS llm.empty, so the
  # empty re-prompt is roled a user turn ("you produced nothing, continue").
  - name: brain.history
    on:
      - request.received
      - llm.message
      - tool.>
      - verify.failed
      - judge.rejected
      - llm.empty
    in: request
    type: llm.history
    params:
      system: |
        You are a coding agent resolving a software issue in a checked-out repository.
        Work in a read → edit → test loop using the provided functions. After every
        edit, run tool.py.test. When the tests pass and the issue is resolved, STOP
        calling functions and reply with a short prose summary — that is your claim of
        completion, which a verifier and a reviewer then evaluate. Never stop before
        the tests pass.
      answer: llm.message
      task_kinds: [request.received]
      emits:
        - tool.fs.read.call
        - tool.fs.edit.call
        - tool.fs.write.call
        - tool.fs.search.call
        - tool.py.test.call
        - llm.message
        - llm.usage

  # judge.history — the reviewer's view: the task, the brain's prose claim, and the
  # test evidence (all user turns — none are the judge's own emits). params.emits is
  # the judge's menu so its own approval/rejection role as assistant.
  - name: judge.history
    on:
      - request.received
      - llm.message
      - tool.py.test.result
    in: request
    type: llm.history
    params:
      system: |
        You are an independent reviewer. A coding agent claims it resolved the issue and
        an automated check has confirmed the tests pass. Decide whether the change
        genuinely resolves the described issue rather than gaming the tests. If it does,
        call judge.approved; otherwise reply with a short reason (prose or silence both
        count as NOT approved).
      answer: judge.rejected
      task_kinds: [request.received]
      emits:
        - judge.approved
        - judge.rejected
        - llm.usage
