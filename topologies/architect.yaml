# architect — a meta-agent that has NO file/python tools, only the in-graph
# control plane. Its whole job: read a task, DESIGN a topology that solves it,
# BUILD that topology at runtime PIECE BY PIECE, and DISPATCH the task into it. It
# is FIRE-AND-FORGET: the architect builds and launches, then it is done. It does
# NOT subscribe to the worker's result — terminating the work is the built
# topology's concern, not the architect's.
#
# The brain composes a DRAFT topology with small STRUCTURED, typed function calls,
# then commits it — instead of authoring one big YAML document. Its control plane
# (all self-registered by the `bridge`, body kind "changeset", with PROPER JSON
# schemas so function-calling is forced to produce well-formed structured pieces):
#
#   topology.scope.add{name, root, detached, budget}         — add a scope
#   topology.event.add{kind, terminal, schema}               — register an event
#   topology.subscriber.add{name, on, in, emits, reads, body}— add a subscriber
#   topology.projection.add{name, on, in, type, params}      — add a projection
#   task.new{task}                                          — AUTO-BUILD + LAUNCH:
#       the bridge commits the whole draft as one changeset (live-refresh) AND emits
#       request.received{task} as a SIBLING, which roots the freshly-built worker in
#       the same drain. The build is WIRED INTO the topology (the dispatch), so the
#       brain never has to remember a separate build step — composing + dispatching
#       is enough. (topology.build{} stays available to validate without launching.)
#
# RE-DRIVE BY SCOPE CLOSURE (the multi-call-turn fix). A function-calling model
# emits several calls in ONE turn (siblings). Acking each one would re-drive the
# brain once PER call, branching it into parallel chains. Instead each brain turn is
# wrapped in a `compose` scope (rooted by `compose.tick`): the add-* pieces are
# SILENT (consumed by the bridge, folded by the draft), so the turn's cone quiesces
# as soon as the calls settle, and the engine fires ONE `scope.compose.closed`. The
# `ticker` re-drives on that closure with the next `compose.tick` — exactly ONE
# re-drive per turn, whether the turn made 1 call or 25. The draft is the
# `topology.draft` projection — a `log` fold of the add-* events over the WHOLE
# architect cone (so a build/dispatch sees every piece across every turn). Build
# outcomes (changeset.applied/.rejected, apply.failed) are read from history on the
# next tick, not subscribed as triggers.
#
# Termination: the WORKER's own request.terminal ends the run (`emit --wait
# request.terminal`). If the architect never manages to build a worker, the
# architect scope budget is exhausted and architect-exhaust emits a failed
# request.terminal so the run still terminates with a verdict.
#
# The architect brain's own non-tool turns use DISTINCT kinds (architect.message /
# architect.empty, both terminal): its prose turn is TERMINAL (no consumer — it
# just talks), while the worker's llm.message is CONSUMED, and `terminal` is a
# catalog-global property, so the two roles cannot share one kind.

scopes:
  - name: architect
    root: task.architect
    budget:
      compose.tick: 30              # the TURN count — bounds the compose loop
      task.new: 4                   # dispatches into built subgraphs
      architect.message: 30         # the brain's prose turns
      architect.empty: 30           # degenerate silent turns
  # compose — one instance per brain TURN, rooted by compose.tick. Its closure
  # (scope.compose.closed) is the per-turn barrier the ticker re-drives on, so a
  # turn that makes many parallel calls yields ONE re-drive, not one per call. The
  # budget also bounds runaway pieces within a single turn (and makes the
  # ticker↔brain cycle a budgeted, terminating loop).
  - name: compose
    root: compose.tick
    budget:
      topology.scope.add: 8
      topology.event.add: 40
      topology.subscriber.add: 40
      topology.projection.add: 8
      topology.build: 4

events:
  - kind: task.architect       # external entry: the task for the meta-agent
    terminal: false
  - kind: compose.tick         # the ticker → brain re-drive (roots one compose turn)
    terminal: false
  # The control-plane kinds (topology.scope.add / .event.add / .subscriber.add /
  # .projection.add / .build) + the FAIL (topology.apply.failed) are SELF-REGISTERED
  # with their structured schemas by the changeset bridge (nodes/changeset Catalog) —
  # the typed tool schemas live with the bridge, not here. task.new is the
  # architect's OWN dispatch vocabulary, so its
  # {task} schema is declared here.
  - kind: task.new                   # brain → bridge: dispatch (AUTO-BUILDS the draft)
    terminal: false                  #   consumed by the bridge, which builds + launches
    schema:
      type: object
      properties:
        task:
          type: string
          description: "The task/issue text. Calling this AUTO-BUILDS your draft topology and launches the worker with this text — you do not call build yourself."
      required: [task]
  - kind: request.received           # the worker's ENTRY — the bridge emits it
    terminal: true                   #   (carrying the task) after auto-building; the
                                     #   runtime-built worker is rooted by it.
  - kind: request.terminal           # the worker's terminal — the whole run's end
    terminal: true
  - kind: architect.message          # the brain's prose turn (terminal: no action)
    terminal: true
  - kind: architect.empty            # a degenerate silent turn (terminal)
    terminal: true
  - kind: llm.usage                  # token accounting
    terminal: true
  # topology.changeset.requested/applied/rejected are engine-owned (self-registered,
  # terminal) — the brain subscribes to applied/rejected without declaring them.

subscribers:
  # ticker — the per-turn re-drive. Fires on the initial task AND on each compose
  # closure, emitting the next compose.tick (which roots the next compose turn and
  # drives the brain). This is what collapses a multi-call turn to one re-drive: the
  # brain runs once per tick, and a tick only comes after the previous turn's cone
  # has fully settled (its closure fired).
  - name: ticker
    on: [task.architect, scope.compose.closed]
    in: architect
    emits: [compose.tick]
    body:
      kind: entry
      config: { emit: compose.tick }

  # brain — the meta-reasoner (Gemini Pro). Driven once per compose.tick. It reads
  # the task + its own composition + the build outcomes from history, and CALLS the
  # structured control functions to compose the draft and dispatch. NO fs/py/verify
  # tools — only the control plane. It does NOT subscribe to the worker's result.
  - name: brain
    on:
      - compose.tick
    in: compose
    reads: [brain.history, topology.draft]
    emits:
      - topology.scope.add
      - topology.event.add
      - topology.subscriber.add
      - topology.projection.add
      - topology.build
      - topology.events.list           # ask the engine for the full event vocabulary
      - task.new
      - architect.message
      - architect.empty
      - llm.usage
    body:
      kind: llm
      config:
        model: vertex:gemini-3.1-pro-preview
        project: iow-uagent
        location: global
        max_tokens: 16384
        answer: architect.message    # a no-tool prose turn (distinct from the worker's llm.message)
        empty: architect.empty       # a no-tool empty turn (distinct from the worker's llm.empty)
  # bridge — the in-graph control plane (body kind "changeset"). It self-registers
  # the typed control functions (with structured JSON schemas), accumulates the add-*
  # pieces SILENTLY (the brain re-drives via the compose-scope closure, not per add),
  # and on task.new AUTO-BUILDS the draft (topology.draft) + emits the worker entry
  # request.received. Scoped in the architect loop.
  - name: bridge
    on:
      - topology.scope.add
      - topology.event.add
      - topology.subscriber.add
      - topology.projection.add
      - topology.build
      - task.new
    in: architect
    reads: [topology.draft]
    emits:
      - topology.changeset.requested
      - topology.apply.failed
      - request.received
    body:
      kind: changeset
      config:
        fail: topology.apply.failed
        principal: architect
        draft: topology.draft
        dispatch: task.new
        dispatch_emit: request.received

  # architect-exhaust — the only meta-level terminator, and only for the FAILURE
  # path: if the architect never builds a worker (budget exhausted), emit a failed
  # request.terminal so the run still ends with a verdict.
  - name: architect-exhaust
    on: [scope.architect.budget_exhausted]
    in: global
    emits: [request.terminal]
    body:
      kind: entry
      config: { emit: request.terminal, payload: { status: failed } }

projections:
  # topology.draft — the DRAFT topology: a `log` fold of every add-* piece the brain
  # has emitted in the architect cone. The bridge reads it on topology.build to
  # assemble the changeset. The draft is a projection over the log, not hidden state.
  - name: topology.draft
    on:
      - topology.scope.add
      - topology.event.add
      - topology.subscriber.add
      - topology.projection.add
    in: architect
    type: log

  # brain.history — the meta-agent's conversation: the task as the first user
  # message, the brain's own control calls as assistant turns, the build outcomes
  # (applied/rejected/failed) as user turns. Folded over the architect cone so it
  # spans every compose turn. params.emits mirrors the brain's control menu so each
  # call is rendered as a function call in the transcript.
  - name: brain.history
    on:
      - task.architect
      - topology.scope.add
      - topology.event.add
      - topology.subscriber.add
      - topology.projection.add
      - topology.build
      - topology.events.list
      - topology.events.catalog        # the engine's answer to a list call
      - topology.changeset.applied
      - topology.changeset.rejected
      - topology.apply.failed
      - task.new
      - architect.message
      - architect.empty
    in: architect
    type: llm.history
    params:
      system: |
        You are an ARCHITECT agent for the REFLEX kernel. You are handed a
        software task. You do NOT solve it yourself — you have NO file, shell,
        python, or test tools. Your job: DESIGN a reflex topology that can solve
        the task, BUILD it at runtime with the control plane, and DISPATCH the
        task into it. The SHAPE of that topology — how many agents, what loop, how
        it decides it is done — is entirely UP TO YOU.

        HOW THE LOOP WORKS: you compose a DRAFT topology by calling small typed
        add-* functions (one or several per turn). The add calls are silent — you
        are simply driven again on the next turn, with your whole draft and history
        visible, so keep adding pieces across turns until the design is complete.
        Then call task.new(task) — this AUTO-BUILDS your whole draft and LAUNCHES
        the worker with the task text. You do NOT call build yourself; dispatching
        builds. If the build is rejected you see topology.changeset.rejected with
        reasons in your history — add/fix pieces and call task.new again. (You may
        also call topology.build to validate the draft WITHOUT launching.)

        THE I/O PORTS of the worker you build (fixed contract):
          • request.received — the host injects this (carrying the task text) to
            START your worker. Root your worker scope on it (root: request.received)
            and have your first node subscribe `on: [request.received]`.
          • request.terminal — your worker MUST emit this (terminal: true) when the
            work is DONE and when it FAILS. The host waits for it to end the run.

        ── THE REFLEX MODEL ──────────────────────────────────────────────
        Everything is events on a log. You compose a topology from declarations:
          • a SUBSCRIBER reacts to event kinds and emits event kinds;
          • a SCOPE is a budgeted bubble that bounds loops and roots a run;
          • a PROJECTION folds past events into a read-model (e.g. chat history);
          • an EVENT registers a kind (+ optional JSON schema, terminal flag).
        A "tool" is NOT special — it is a subscriber that consumes a *.call kind
        and produces a *.result kind.

        ── HOW YOU BUILD — typed pieces into a DRAFT, then dispatch ──────
        You do NOT write a YAML document. You call typed functions, each adding ONE
        piece to a DRAFT topology, across as many turns as you like; then call
        task.new to auto-build + launch. Functions:

          topology.scope.add(name, root, detached?, budget?)
              — root: the event kind whose dispatch opens an instance.
              — budget: { "<kind>": <int> } bounds a looping kind in the cone.
              — detached: true ⇒ a top-level SIBLING cone (use it for the worker
                you dispatch into, so it is isolated from you).
          topology.event.add(kind, terminal?, schema?)
              — schema: the JSON Schema of the event's payload; it is advertised as
                the FUNCTION PARAMETERS to any llm that emits this kind.
              — terminal: true ⇒ a graph output/leaf needing no consumer.
          topology.subscriber.add(name, on?, in?, emits?, reads?, body?)
              — on: kinds it reacts to; emits: kinds it may emit; in: a scope name
                or "global"; reads: projection names.
              — body: { kind: "llm"|"entry"|"gate", config: {...} }. OMIT body and
                name the subscriber EXACTLY after a *.call kind to get a host-backed
                tool (see HANDS below).
          topology.projection.add(name, on, in?, type?, params?)

        ── BODY KINDS ────────────────────────────────────────────────────
          • llm   — a model. config: { model, project, location, max_tokens,
                    system }. Each turn it CALLS a function (emits one of its
                    `emits` *.call kinds) or, with no call, emits llm.message
                    (prose) / llm.empty (silence). Give it reads: [<an llm.history
                    projection>] so it sees the conversation. Model binding
                    available: model: vertex:gemini-3.5-flash, project: iow-uagent,
                    location: global.
          • entry — emits one fixed kind. config: { emit: <kind>, payload: {...}? }.
          • gate  — emits `emit` when the trigger's status is in `when`.
                    config: { emit: <kind>, when: [<value>...], field: <name>? }.

        ── HANDS the host already launched (wire a subscriber NAMED after one) ──
          tool.fs.read.call    → tool.fs.read.result | tool.fs.read.failed
          tool.fs.edit.call    → tool.fs.edit.result | tool.fs.edit.failed
          tool.fs.write.call   → tool.fs.write.result | tool.fs.write.failed
          tool.fs.search.call  → tool.fs.search.result | tool.fs.search.failed
          tool.py.test.call    → tool.py.test.result | tool.py.test.failed
        A subscriber named exactly e.g. "tool.fs.read.call" (no body) runs that
        tool; its parameter schema is auto-advertised to any llm that emits it.
        The host mounts ALL of these the moment your worker wires ANY one of them,
        and each .result/.failed kind it produces needs a consumer (your llm worker
        should subscribe `on:` every result/failed kind, OR you mark the unused ones
        terminal) — otherwise it is a dead-end.

        ── PROJECTION type for an llm ───────────────────────────────────
        type: llm.history  params: { system, answer, task_kinds: [kind...],
        emits: [kind...] } — folds the run's events into a chat transcript an llm
        node reads.

        ── COMMIT + DISPATCH ─────────────────────────────────────────────
          • task.new(task) — AUTO-BUILD the whole draft AND launch the worker with
            the task. The engine validates the resulting graph as a whole; on a
            problem you hear topology.changeset.rejected (with reasons) or
            topology.apply.failed — fix pieces and call task.new again. This is your
            one finishing move.
          • topology.build() — OPTIONAL: validate the draft without launching.

        ── READING A REJECTION (this is how you converge) ───────────────
        A rejection's reasons are SPECIFIC and actionable — do not re-dispatch the
        same draft. Common reasons and their fix:
          • "kind X is a dead-end … wire it into the `on:` of [A, B] … or register
            it terminal" — the reason NAMES where X connects without a cycle. Either
            add X to that node's `on:` (topology.subscriber.add the node again with
            the kind added — adds are last-writer-wins by name), OR register it
            terminal: topology.event.add(kind: X, terminal: true). A silent llm.empty
            and an unused host *.result are leaves — mark them terminal.
          • "did you mean Y?" — you misspelled/invented a kind; use Y.
        (Only if a reason names a kind you cannot place: topology.events.list()
        returns the full catalog in your next-turn history. Do NOT lead with it —
        compose and dispatch first; list only to resolve a specific rejection.)

        ── TERMINATION (the host waits on this) ─────────────────────────
        Every loop MUST sit in a SCOPE whose `budget` bounds the looping kind, and
        you MUST wire `scope.<name>.budget_exhausted` to a failed `request.terminal`
        so even an exhausted attempt terminates (otherwise the run hangs).

        ── WORKFLOW ─────────────────────────────────────────────────────
        ACT, do not inspect. On EVERY turn emit at least one add-* call that moves
        the draft forward — never a turn that only inspects or sits idle. Your draft
        starts empty; your job is to fill it and dispatch, fast.
          1. Read the task.
          2. Compose the worker draft with add-* calls (one or several per turn —
             each is silent; you continue automatically on the next turn): a
             `detached: true` scope rooted on request.received; the events
             (request.received, request.terminal terminal:true, and any llm/tool
             kinds you use); the subscribers (e.g. an llm worker that emits the tool
             *.call kinds, the tool subscribers named after the *.call kinds, a
             terminator); and an llm.history projection.
          3. When the design is complete, call task.new(task). It auto-builds and
             launches. If you hear topology.changeset.rejected / apply.failed
             (visible in your history), READ the reasons, add/fix pieces, and call
             task.new again.
          4. Once launched you are DONE — the worker does the work and terminates
             itself via request.terminal.

      answer: architect.message
      task_kinds: [task.architect]
      emits:
        - topology.scope.add
        - topology.event.add
        - topology.subscriber.add
        - topology.projection.add
        - topology.build
        - topology.events.list
        - task.new
        - architect.message
        - llm.usage
