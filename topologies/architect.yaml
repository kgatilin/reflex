# architect — a meta-agent that has NO file/python tools, only the in-graph
# control plane. Its whole job: read a task, DECIDE what topology solves it,
# BUILD that topology at runtime, and DISPATCH the task into it. It is
# FIRE-AND-FORGET: the architect builds and launches, then it is done. It does
# NOT subscribe to the worker's result — checking/terminating the work is the
# built topology's concern, not the architect's.
#
# This is the in-graph control plane (doc 20) made into an agent. The brain's two
# capabilities are not plugins — they are ordinary event emits the kernel already
# understands:
#
#   topology.apply.requested{document}  — "apply this topology" — a friendly
#       tool-call carrying a YAML topology document. The `bridge` (body kind
#       "changeset") parses it and emits topology.changeset.requested; the engine
#       validates + commits it like an operator apply and the new subgraph goes
#       LIVE in the same drain (engine live-refresh). The brain hears the outcome
#       on topology.changeset.applied / .rejected (engine-owned) and the parse
#       outcome on topology.apply.failed (the bridge's) — its feedback to iterate.
#
#   task.new{...}                       — "dispatch a prompt into the system" —
#       roots the worker subgraph the brain just built. Because the apply already
#       went live, the dispatched task runs against the freshly-built topology.
#
# The brain builds INCREMENTALLY if it wants: each apply must yield a CONNECTED
# graph (the validator rejects a disconnected outcome, and the reasons come back
# as feedback). Once a worker is built it dispatches task.new and stops.
#
# Termination: the WORKER's own request.terminal ends the run (`emit --wait
# request.terminal`). The architect does not produce or wait on a terminal of its
# own — it launched the work and is done. If the architect never manages to build
# a worker, the architect scope budget is exhausted and architect-exhaust emits a
# failed request.terminal so the run still terminates with a verdict.
#
# The architect brain's own non-tool turns use DISTINCT kinds (architect.message /
# architect.empty, both terminal). The worker scope is now `detached: true` (a root
# scope, doc 31 §4), so the cone-collision/cross-scope-cycle reason for distinct
# kinds is gone — the worker's llm.* turns live in a sibling cone the architect
# never sees. The distinct kinds remain for a SEPARATE reason: the architect's prose
# turn is TERMINAL (no consumer — it just talks), while the worker's llm.message is
# CONSUMED (by worker-done / worker.history); `terminal` is a catalog-global
# property, so the two roles cannot share one kind regardless of detachment.

scopes:
  - name: architect
    root: task.architect
    budget:
      topology.apply.requested: 12   # topology build/iterate attempts
      task.new: 4                    # dispatches into built subgraphs
      architect.message: 6           # the brain's prose turns
      architect.empty: 6             # degenerate silent turns

events:
  - kind: task.architect       # external entry: the task for the meta-agent
    terminal: false
  # topology.apply.requested{document} + topology.apply.failed are SELF-REGISTERED
  # by the changeset bridge (nodes/changeset Catalog) — its tool schema lives with
  # the bridge, not here. task.new is the architect's OWN dispatch vocabulary, so
  # its {task} schema is declared here (the catalog schema IS the function
  # parameter schema the llm node advertises, forcing the model to provide it).
  - kind: task.new                   # brain → (the worker it built): dispatch
    terminal: true                   #   consumed by a subgraph built at runtime
    schema:
      type: object
      properties:
        task:
          type: string
          description: "The task/issue text to dispatch into the worker subgraph you built."
      required: [task]
  - kind: request.terminal           # the worker's terminal — the whole run's end
    terminal: true
  - kind: architect.message          # the brain's prose turn (terminal: no action)
    terminal: true
  - kind: architect.empty            # a degenerate silent turn (terminal)
    terminal: true
  - kind: llm.usage                  # token accounting
    terminal: true
  # topology.changeset.requested/applied/rejected are engine-owned (self-registered,
  # terminal) — the brain subscribes to applied/rejected without declaring them.

subscribers:
  # brain — the meta-reasoner (Gemini Pro). It hears the task and the BUILD
  # outcomes (applied/rejected/failed), reads its history, and CALLS a control
  # function: build (topology.apply.requested) or dispatch (task.new). It has NO
  # fs/py/verify tools — only the control plane. It does NOT subscribe to the
  # worker's result: it builds and launches, then it is done.
  - name: brain
    on:
      - task.architect
      - topology.changeset.applied
      - topology.changeset.rejected
      - topology.apply.failed
    in: architect
    reads: [brain.history]
    emits:
      - topology.apply.requested
      - task.new
      - architect.message
      - architect.empty
      - llm.usage
    body:
      kind: llm
      config:
        model: vertex:gemini-3.1-pro-preview
        project: iow-uagent
        location: global
        max_tokens: 16384
        answer: architect.message    # a no-tool prose turn (distinct from the worker's llm.message)
        empty: architect.empty       # a no-tool empty turn (distinct from the worker's llm.empty)
        system: |
          You are an ARCHITECT agent for the REFLEX kernel. You build REFLEX
          topologies — NOT SWE-agent, NOT LangGraph, NOT any other framework.

          CRITICAL FORMAT RULE: a reflex topology document has ONLY these top-level
          keys: `scopes:`, `subscribers:`, `events:`, `projections:`. There is NO
          `nodes:`, NO `agent:`, NO `tools:` list — those are OTHER frameworks and
          will be REJECTED. A capability is a `subscriber` that emits/consumes event
          KINDS; a "tool" is a subscriber named after a tool-call kind. COPY the
          template below and change only the prompts — do not invent a new schema.

          You have NO file, shell, python, or test tools. You cannot read or write
          code yourself. Your job is to BUILD a topology that can, and LAUNCH the
          task into it. Your ONLY tools are the control plane:

            • topology.apply.requested(document) — apply a reflex topology DOCUMENT
              (YAML, as a string). This BUILDS the running system: the subgraph you
              declare goes live immediately.
            • task.new(task) — dispatch the task INTO the system you built; it roots
              the worker subgraph you declared.

          You solve a task by DESIGNING a topology for it, building it, and
          dispatching the task into it — never by doing the work yourself, and you
          do NOT monitor or wait for the result (the topology you built terminates
          itself).

          THE WORKER TOPOLOGY you build is an ordinary reflex document. The host has
          already launched fs + pytest HANDS confined to the repo; you wire them as
          plain subscribers named after the tool-call kind (the daemon backs each by
          the plugin that handles its kind — no plugin reference needed):

            scopes:
              - name: request
                root: request.received
                detached: true   # a ROOT scope: the worker runs as a top-level
                                 # SIBLING of the architect, not nested under it —
                                 # its llm.* turns never bleed into the architect
                                 # cone, and the architect is done the moment it
                                 # dispatches (genuine fire-and-forget).
                budget: { tool.fs.read.call: 80, tool.fs.edit.call: 60,
                          tool.fs.search.call: 80, tool.py.test.call: 20,
                          llm.message: 8, llm.empty: 6 }
            events:
              - { kind: request.received }
              - { kind: request.terminal, terminal: true }
              - { kind: llm.message }
              - { kind: llm.empty }
              - { kind: llm.usage, terminal: true }
              - { kind: state.updated.status }
            subscribers:
              - name: resolver           # task.new → request.received (carry the text)
                on: [task.new]
                in: global
                emits: [request.received]
                body: { kind: entry, config: { emit: request.received } }
              - name: worker             # the coding brain (llm)
                on: [request.received, tool.fs.read.result, tool.fs.read.failed,
                     tool.fs.edit.result, tool.fs.edit.failed, tool.fs.search.result,
                     tool.fs.search.failed, tool.py.test.result, tool.py.test.failed,
                     llm.empty]
                in: request
                reads: [worker.history]
                emits: [tool.fs.read.call, tool.fs.edit.call, tool.fs.search.call,
                        tool.py.test.call, llm.message, llm.empty, llm.usage]
                body: { kind: llm, config: { model: vertex:gemini-3.5-flash,
                        project: iow-uagent, location: global, max_tokens: 16384,
                        system: "You are a coding agent. Read -> edit -> test using
                        the provided functions. When the issue is resolved and tests
                        pass, STOP calling functions and summarize." } }
              - { name: tool.fs.read.call,   in: request }
              - { name: tool.fs.edit.call,   in: request }
              - { name: tool.fs.search.call, in: request }
              - { name: tool.py.test.call,   in: request }
              - name: done               # worker's prose claim → terminal
                on: [llm.message]
                in: request
                emits: [state.updated.status]
                body: { kind: entry, config: { emit: state.updated.status,
                        payload: { status: done } } }
              - name: terminal-on-done
                on: [state.updated.status]
                in: global
                emits: [request.terminal]
                body: { kind: gate, config: { emit: request.terminal, when: [done] } }
              - name: terminal-on-exhaust
                on: [scope.request.budget_exhausted]
                in: global
                emits: [request.terminal]
                body: { kind: entry, config: { emit: request.terminal,
                        payload: { status: failed } } }
            projections:
              - name: worker.history
                on: [request.received, llm.message, "tool.>", llm.empty]
                in: request
                type: llm.history
                params:
                  system: "You are a coding agent. Read -> edit -> test; when done,
                    stop calling functions and summarize."
                  answer: llm.message
                  task_kinds: [request.received]
                  emits: [tool.fs.read.call, tool.fs.edit.call, tool.fs.search.call,
                          tool.py.test.call, llm.message, llm.usage]

          WORKFLOW (follow EXACTLY):
            1. Read the task (the first user message).
            2. Call topology.apply.requested with `document` set to the COMPLETE
               template above, reproduced VERBATIM as a YAML string — every scope,
               event, subscriber and projection. You may edit ONLY the two `system:`
               strings (the worker brain prompt and the worker.history prompt) to
               mention this specific task. Do NOT abbreviate it, do NOT drop the
               subscribers/projections, do NOT switch to `nodes:`/`agent:`/`tools:`.
               A document with no `subscribers:` builds nothing and is useless.
            3. If you get topology.apply.failed or topology.changeset.rejected, READ
               the error/reasons and re-emit the corrected FULL document.
            4. On topology.changeset.applied, call task.new with `task` set to the
               original issue text. This launches the work and is your LAST action.

          The template above is a COMPLETE, VALID worker. Reproduce it faithfully —
          correctness of the schema matters more than brevity.

  # bridge — turns the brain's "apply this topology" tool-call into an in-graph
  # changeset request (body kind "changeset"). It self-registers its tool schema
  # (topology.apply.requested{document}); it is the only place the document format
  # is parsed on the in-graph path. Scoped in the architect loop.
  - name: bridge
    on: [topology.apply.requested]
    in: architect
    emits: [topology.changeset.requested, topology.apply.failed]
    body:
      kind: changeset
      config:
        fail: topology.apply.failed
        principal: architect

  # architect-exhaust — the only meta-level terminator, and only for the FAILURE
  # path: if the architect never manages to build a worker (budget exhausted), emit
  # a failed request.terminal so the run still ends with a verdict. The SUCCESS path
  # terminates through the worker's own request.terminal — the architect does not
  # wait for it.
  - name: architect-exhaust
    on: [scope.architect.budget_exhausted]
    in: global
    emits: [request.terminal]
    body:
      kind: entry
      config: { emit: request.terminal, payload: { status: failed } }

projections:
  # brain.history — the meta-agent's conversation: the task as the first user
  # message, the brain's own control calls as assistant turns, the build outcomes
  # (applied/rejected/failed) as user turns. params.emits mirrors the brain's menu
  # MINUS architect.empty (a silent turn is roled a user re-prompt).
  - name: brain.history
    on:
      - task.architect
      - topology.apply.requested
      - topology.changeset.applied
      - topology.changeset.rejected
      - topology.apply.failed
      - task.new
      - architect.message
      - architect.empty
    in: architect
    type: llm.history
    params:
      system: |
        You are an ARCHITECT agent with only the control plane: build a topology
        for the task (topology.apply.requested) and dispatch the task into it
        (task.new). You have no file/python tools and you do not monitor the result.
      answer: architect.message
      task_kinds: [task.architect]
      emits:
        - topology.apply.requested
        - task.new
        - architect.message
        - llm.usage
