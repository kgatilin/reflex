# Reflex architecture overlay for Archai.
#
# Two strata coexist during the substrate rebuild (docs 24/26/28):
#   - kernel + nodes: the converged substrate being built (engine/, nodes/).
#   - domain/runtime/adapters: the legacy shipped packages (pkg/*), retired
#     incrementally per doc 24 §10.

module: github.com/kgatilin/reflex

layers:
  # Converged substrate (the rebuild).
  kernel:
    - engine
  nodes:
    - nodes/llm
    - nodes/tool

  # Legacy shipped packages (being retired).
  domain:
    - pkg/event
    - pkg/config
    - pkg/cycle
    - pkg/projection

  runtime:
    - pkg/bus
    - pkg/handler
    - pkg/graph
    - pkg/analyzer
    - internal/runtime

  adapters:
    - cmd/...
    - pkg/sdk

layer_rules:
  kernel: []
  nodes: [kernel]
  domain: []
  runtime: [domain]
  adapters: [domain, runtime]

aggregates:
  engine:
    root: github.com/kgatilin/reflex/engine.Engine
  llm:
    root: github.com/kgatilin/reflex/nodes/llm.Config
  tool:
    root: github.com/kgatilin/reflex/nodes/tool.Func
  event:
    root: github.com/kgatilin/reflex/pkg/event.Event
  config:
    root: github.com/kgatilin/reflex/pkg/config.File
  cycle:
    root: github.com/kgatilin/reflex/pkg/cycle.Edge
  projection:
    root: github.com/kgatilin/reflex/pkg/projection.Store
  bus:
    root: github.com/kgatilin/reflex/pkg/bus.Bus
  handler:
    root: github.com/kgatilin/reflex/pkg/handler.Handler
  graph:
    root: github.com/kgatilin/reflex/pkg/graph.HandlerGraph
  runtime:
    root: github.com/kgatilin/reflex/internal/runtime.Result
  sdk:
    root: github.com/kgatilin/reflex/pkg/sdk.Handler

bounded_contexts:
  kernel:
    name: Kernel
    description: The converged substrate — Event/Reaction/Projection primitives and the append/dispatch engine (docs 24/26).
    aggregates: [engine]
    downstream: [nodes]
    relationship: shared-kernel
  nodes:
    name: Nodes
    description: Built-in reaction bodies (llm, tool) over the kernel.
    aggregates: [llm, tool]
    upstream: [kernel]
    relationship: shared-kernel
  domain:
    name: Domain
    description: Event envelope, YAML configuration, and cycle primitives.
    aggregates: [event, config, cycle]
    downstream: [runtime, adapters]
    relationship: shared-kernel
  runtime:
    name: Runtime
    description: Event bus, subscription graph, handlers, projections, and drain execution.
    aggregates: [bus, handler, graph, runtime, projection]
    upstream: [domain]
    relationship: shared-kernel
  adapters:
    name: Adapters
    description: CLI commands and embeddable SDK entrypoints into the event runtime.
    aggregates: [sdk]
    upstream: [runtime, domain]
    relationship: open-host
