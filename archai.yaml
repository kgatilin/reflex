# Reflex architecture overlay for Archai.
#
# The legacy stratum (pkg/bus, pkg/handler, pkg/sdk, cmd/reflex, plugins/*,
# internal/runtime, …) was removed — only the converged substrate remains.

module: github.com/kgatilin/reflex

layers:
  # The kernel: the three primitives + scopes + projections + catalog + view
  # types + validator + dispatch + the changeset-fold control plane.
  kernel:
    - engine

  # Built-in reaction bodies over the kernel. The engine is body-agnostic;
  # bodies are resolved by name from the nodes registry.
  nodes:
    - nodes
    - nodes/llm
    - nodes/tool

  # The runtime shell + declarative surface around the kernel.
  host:
    - pkg/daemon
    - pkg/topology
    - cmd/...

  # Shared: the neutral model interface + real Vertex adapters.
  adapters:
    - pkg/provider

layer_rules:
  kernel: []
  nodes: [kernel]
  adapters: []
  host: [kernel, nodes, adapters]

aggregates:
  engine:
    root: github.com/kgatilin/reflex/engine.Engine
  llm:
    root: github.com/kgatilin/reflex/nodes/llm.Config
  tool:
    root: github.com/kgatilin/reflex/nodes/tool.Func
  daemon:
    root: github.com/kgatilin/reflex/pkg/daemon.Daemon
  topology:
    root: github.com/kgatilin/reflex/pkg/topology.Document
  provider:
    root: github.com/kgatilin/reflex/pkg/provider.Provider

bounded_contexts:
  kernel:
    name: Kernel
    description: The converged substrate — Event/Reaction/Projection primitives, the append/dispatch engine, and the changeset-fold control plane (docs CONCEPT/28).
    aggregates: [engine]
    downstream: [nodes, host]
    relationship: shared-kernel
  nodes:
    name: Nodes
    description: Built-in reaction bodies (llm, tool) over the kernel, resolved by name from the registry.
    aggregates: [llm, tool]
    upstream: [kernel]
    relationship: shared-kernel
  host:
    name: Host
    description: The runtime shell — the daemon, the declarative topology document, and the reflexd CLI.
    aggregates: [daemon, topology]
    upstream: [kernel, nodes, adapters]
    relationship: open-host
  adapters:
    name: Adapters
    description: Neutral completion interface + real Vertex model adapters (Gemini, Claude, OSS).
    aggregates: [provider]
    downstream: [host, nodes]
    relationship: open-host
